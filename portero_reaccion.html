<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portero — Tiempo de Reacción</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --text: #1a1a1a;
    --text-muted: #888;
    --red: #e53e2a;
    --yellow: #f5c842;
    --green: #22c55e;
    --shadow: rgba(0,0,0,0.12);
  }

  body {
    background: #ffffff;
    font-family: 'Barlow Condensed', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before { display: none; }

  .field-arc {
    position: fixed;
    bottom: -180px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 350px;
    border: 2px solid rgba(0,0,0,0.05);
    border-radius: 50% 50% 0 0;
    pointer-events: none;
  }

  .title-block {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
  }

  .title-block h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    letter-spacing: 0.08em;
    color: var(--text);
    text-shadow: none;
    line-height: 1;
  }

  .title-block p {
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Main layout: button + timer side by side */
  .game-row {
    display: flex;
    align-items: center;
    gap: 48px;
    margin-bottom: 40px;
  }

  /* Big button */
  .btn-wrap {
    position: relative;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-outer {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #888, #444 60%, #222);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.7),
      inset 0 2px 6px rgba(255,255,255,0.15),
      inset 0 -4px 12px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s;
  }

  .btn-inner {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ff6a6a, #e53e2a 50%, #8b1c10);
    box-shadow:
      0 4px 20px rgba(229,62,42,0.6),
      inset 0 3px 10px rgba(255,255,255,0.25),
      inset 0 -4px 10px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn-inner::after {
    content: '';
    position: absolute;
    top: 14%;
    left: 18%;
    width: 42%;
    height: 26%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.35), transparent 80%);
    border-radius: 50%;
    pointer-events: none;
  }

  .btn-inner.green {
    background: radial-gradient(circle at 38% 32%, #90ff90, #3de56a 50%, #1a8c38);
    box-shadow: 0 4px 28px rgba(61,229,106,0.7), inset 0 3px 10px rgba(255,255,255,0.25);
  }

  .btn-inner.yellow {
    background: radial-gradient(circle at 38% 32%, #fff176, #f5c842 50%, #b8860b);
    box-shadow: 0 4px 28px rgba(245,200,66,0.7), inset 0 3px 10px rgba(255,255,255,0.25);
  }

  .btn-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    z-index: 1;
    pointer-events: none;
    text-align: center;
    line-height: 1.1;
  }

  .btn-wrap:active .btn-outer { transform: scale(0.95); }

  /* Pulse ring on green (waiting) */
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .pulse-ring {
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid var(--green);
    animation: pulse-ring 1.1s ease-out infinite;
    pointer-events: none;
    display: none;
  }

  .pulse-ring.visible { display: block; }

  /* Timer display */
  .timer-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 180px;
  }

  .timer-label {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .timer-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 12vw, 7rem);
    line-height: 1;
    color: var(--text);
    letter-spacing: 0.04em;
    transition: color 0.2s;
  }

  .timer-value.fast { color: var(--green); }
  .timer-value.medium { color: var(--yellow); }
  .timer-value.slow { color: var(--red); }
  .timer-value.terrible { color: var(--red); }

  .timer-unit {
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: -4px;
  }

  /* Status message */
  .status-msg {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.1em;
    color: #aaa;
    min-height: 2.2rem;
    text-align: center;
    transition: all 0.3s;
  }

  .status-msg.go { color: var(--green); animation: flash 0.3s ease; }
  .status-msg.result-fast { color: var(--green); }
  .status-msg.result-medium { color: var(--yellow); }
  .status-msg.result-slow { color: var(--red); }
  .status-msg.result-terrible { color: var(--red); font-size: 1.3rem; }

  @keyframes flash {
    0% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 36px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.1);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    line-height: 1;
    color: var(--text);
  }

  .stat-lbl {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* History mini-dots */
  .history-dots {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    align-items: center;
    justify-content: center;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    transition: background 0.3s;
  }
  .dot.fast { background: var(--green); }
  .dot.medium { background: var(--yellow); }
  .dot.slow { background: var(--red); }

  /* Too early shake */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* ===== RECORD BOX ===== */
  .record-box {
    display: none;
    position: relative;
    margin-bottom: 28px;
    background: linear-gradient(135deg, rgba(61,229,106,0.12), rgba(61,229,106,0.04));
    border: 2px solid rgba(61,229,106,0.5);
    border-radius: 16px;
    padding: 14px 32px;
    text-align: center;
    min-width: 280px;
    overflow: hidden;
  }

  .record-box.visible { display: block; }

  .record-box::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(61,229,106,0.07), transparent);
    animation: shimmer 2.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .record-crown {
    font-size: 1.4rem;
    line-height: 1;
    margin-bottom: 2px;
  }

  .record-label {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--green);
    opacity: 0.8;
  }

  .record-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    line-height: 1;
    color: var(--green);
    text-shadow: 0 0 24px rgba(61,229,106,0.5);
    letter-spacing: 0.06em;
  }

  .record-unit {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: rgba(61,229,106,0.5);
    text-transform: uppercase;
  }

  /* Burst animation when record is broken */
  @keyframes record-burst {
    0%   { transform: scale(0.7); opacity: 0; }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .record-box.new-record {
    animation: record-burst 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    border-color: var(--green);
    box-shadow: 0 0 40px rgba(61,229,106,0.35);
  }

  /* Flying stars on new record */
  .star {
    position: fixed;
    pointer-events: none;
    font-size: 1.5rem;
    animation: star-fly 1s ease-out forwards;
    z-index: 999;
  }

  @keyframes star-fly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* Instruction hint */
  .hint {
    font-size: 0.8rem;
    color: #bbb;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="field-arc"></div>

<div class="title-block">
  <h1>Reacción Portero</h1>
  <p>Entrena tu tiempo de reacción</p>
</div>

<!-- RECORD BOX -->
<div class="record-box" id="recordBox">
  <div class="record-crown">🏆</div>
  <div class="record-label">Récord Personal</div>
  <div class="record-time" id="recordTime">—</div>
  <div class="record-unit">segundos</div>
</div>

<div class="game-row">
  <div class="btn-wrap" id="mainBtn" onclick="handleClick()">
    <div class="pulse-ring" id="pulseRing"></div>
    <div class="btn-outer">
      <div class="btn-inner" id="btnInner">
        <span class="btn-label" id="btnLabel">LISTO</span>
      </div>
    </div>
  </div>

  <div class="timer-block">
    <div class="timer-label">Tiempo</div>
    <div class="timer-value" id="timerVal">0.00</div>
    <div class="timer-unit">segundos</div>
  </div>
</div>

<div class="status-msg" id="statusMsg">Presiona para comenzar</div>
<div class="hint" id="hintText">Haz clic cuando el botón se ponga verde</div>

<div class="stats-bar" id="statsBar" style="display:none">
  <div class="stat">
    <div class="stat-num" id="statBest">—</div>
    <div class="stat-lbl">Mejor</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statAvg">—</div>
    <div class="stat-lbl">Promedio</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statCount">0</div>
    <div class="stat-lbl">Intentos</div>
  </div>
</div>

<div class="history-dots" id="historyDots"></div>

<script>
  // States: 'idle', 'waiting', 'ready', 'result', 'tooearly'
  let state = 'idle';
  let startTime = 0;
  let rafId = null;
  let timeoutId = null;
  let results = [];
  const MAX_DOTS = 10;

  const btn = document.getElementById('mainBtn');
  const btnInner = document.getElementById('btnInner');
  const btnLabel = document.getElementById('btnLabel');
  const pulseRing = document.getElementById('pulseRing');
  const timerVal = document.getElementById('timerVal');
  const statusMsg = document.getElementById('statusMsg');
  const hintText = document.getElementById('hintText');
  const statsBar = document.getElementById('statsBar');
  const statBest = document.getElementById('statBest');
  const statAvg = document.getElementById('statAvg');
  const statCount = document.getElementById('statCount');
  const historyDots = document.getElementById('historyDots');
  const recordBox = document.getElementById('recordBox');
  const recordTime = document.getElementById('recordTime');
  let personalRecord = null;

  function setBtn(color, label) {
    btnInner.className = 'btn-inner' + (color ? ' ' + color : '');
    btnLabel.textContent = label;
  }

  function updateTimer() {
    const elapsed = (performance.now() - startTime) / 1000;
    timerVal.textContent = elapsed.toFixed(2);
    timerVal.className = 'timer-value';
    rafId = requestAnimationFrame(updateTimer);
  }

  function stopTimer() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function getCategory(t) {
    if (t > 1.0) return 'terrible';
    if (t < 0.25) return 'fast';
    if (t < 0.40) return 'medium';
    return 'slow';
  }

  function getRating(cat) {
    if (cat === 'terrible') return '💀 No eres bueno, ¿estás bien?';
    if (cat === 'fast') return '⚡ ¡Reacción élite!';
    if (cat === 'medium') return '👍 ¡Buenos reflejos!';
    return '😤 ¡Sigue entrenando!';
  }

  function handleClick() {
    if (state === 'idle' || state === 'result') {
      startWaiting();
    } else if (state === 'waiting') {
      // Too early!
      tooEarly();
    } else if (state === 'ready') {
      // Register reaction
      stopTimer();
      const t = (performance.now() - startTime) / 1000;
      showResult(t);
    } else if (state === 'tooearly') {
      startWaiting();
    }
  }

  function startWaiting() {
    state = 'waiting';
    clearTimeout(timeoutId);
    stopTimer();

    setBtn('yellow', 'ESPERA...');
    pulseRing.classList.remove('visible');
    timerVal.className = 'timer-value';
    timerVal.textContent = '0.00';
    statusMsg.className = 'status-msg';
    statusMsg.textContent = 'Preparate...';
    hintText.textContent = '¡No hagas clic todavía!';

    const delay = 1500 + Math.random() * 3000;
    timeoutId = setTimeout(goGreen, delay);
  }

  function goGreen() {
    state = 'ready';
    setBtn('green', '¡YA!');
    pulseRing.classList.add('visible');
    startTime = performance.now();
    rafId = requestAnimationFrame(updateTimer);
    statusMsg.className = 'status-msg go';
    statusMsg.textContent = '¡AHORA! ¡AHORA! ¡AHORA!';
    hintText.textContent = '¡Haz clic lo más rápido que puedas!';
  }

  function showResult(t) {
    state = 'result';
    const cat = getCategory(t);
    results.push({ t, cat });

    pulseRing.classList.remove('visible');
    setBtn('', 'OTRA VEZ');
    timerVal.textContent = t.toFixed(2);
    timerVal.className = 'timer-value ' + cat;

    statusMsg.className = 'status-msg result-' + cat;
    statusMsg.textContent = getRating(cat);
    hintText.textContent = 'Clic para intentar de nuevo';

    updateStats();
    addDot(cat);
    checkRecord(t);
  }

  function checkRecord(t) {
    const isNew = personalRecord === null || t < personalRecord;
    if (isNew) {
      personalRecord = t;
      recordTime.textContent = t.toFixed(2);
      recordBox.classList.add('visible');
      recordBox.classList.remove('new-record');
      // Force reflow to restart animation
      void recordBox.offsetWidth;
      recordBox.classList.add('new-record');
      if (results.length > 1) launchStars();
      setTimeout(() => recordBox.classList.remove('new-record'), 600);
    }
  }

  function launchStars() {
    const emojis = ['⭐','🌟','✨','💫','🔥'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 160;
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      s.style.animationDelay = (Math.random() * 0.2) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }

  function tooEarly() {
    state = 'tooearly';
    clearTimeout(timeoutId);
    stopTimer();
    pulseRing.classList.remove('visible');
    setBtn('', '¡ANTES!');
    timerVal.textContent = '0.00';
    timerVal.className = 'timer-value slow';
    statusMsg.className = 'status-msg result-slow';
    statusMsg.textContent = '😬 ¡Demasiado pronto!';
    hintText.textContent = 'Clic para intentar de nuevo';
    btn.classList.add('shake');
    setTimeout(() => btn.classList.remove('shake'), 400);
  }

  function updateStats() {
    statsBar.style.display = 'flex';
    const times = results.map(r => r.t);
    const best = Math.min(...times);
    const avg = times.reduce((a,b) => a+b, 0) / times.length;
    statBest.textContent = best.toFixed(2) + 's';
    statAvg.textContent = avg.toFixed(2) + 's';
    statCount.textContent = results.length;
  }

  function addDot(cat) {
    const dots = historyDots.querySelectorAll('.dot');
    if (dots.length >= MAX_DOTS) dots[0].remove();
    const d = document.createElement('div');
    d.className = 'dot ' + cat;
    historyDots.appendChild(d);
  }

  // Keyboard support (spacebar)
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); handleClick(); }
  });
</script>
</body>
</html>
