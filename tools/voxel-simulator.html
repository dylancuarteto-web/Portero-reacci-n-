<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxel Structure Simulator</title><style>body{margin:0;background:#101722;color:#eef;font:15px system-ui;padding:14px}main{max-width:950px;margin:auto}section{background:#1d2a3b;padding:12px;border-radius:12px;margin:10px 0}button,input{padding:9px;margin:4px;background:#30445e;color:white;border:1px solid #58708f;border-radius:7px}canvas{width:100%;height:480px;background:#0b1018;touch-action:none;border-radius:8px}.sw{width:34px;height:34px;border:2px solid #fff}</style><main><h2>Voxel Structure Simulator</h2><p>Editor isométrico de estructuras. Simula el diseño visual, no el motor real de Minecraft.</p><section><button onclick="tool='place'">Colocar</button><button onclick="tool='erase'">Borrar</button><button onclick="sample()">Casa de ejemplo</button><button onclick="clearAll()">Limpiar</button><button onclick="save()">Exportar structure-design.json</button><button onclick="document.getElementById('f').click()">Importar</button><input hidden id="f" type="file" accept=".json" onchange="loadFile(event)"><label>Capa Y <input id="layer" type="range" min="0" max="20" value="0" oninput="y=+this.value;draw()"></label><div id="palette"></div></section><section><canvas id="c" width="900" height="600"></canvas><p id="count">0 bloques</p></section></main><script>
let blocks={},tool='place',mat='stone',y=0;let mats={stone:'#858b93',dirt:'#805b3b',grass:'#6b9b48',planks:'#b88950',glass:'#9bdde2',brick:'#a65b50',gold:'#e7c34d',leaves:'#4c8a50',obsidian:'#514166'};let c=document.getElementById('c'),x=c.getContext('2d');document.getElementById('palette').innerHTML=Object.entries(mats).map(([k,v])=>`<button class="sw" style="background:${v}" onclick="mat='${k}'" title="${k}"></button>`).join('');function key(a,b,d){return `${a},${b},${d}`}function iso(a,b,d){return [450+(a-d)*22,100+(a+d)*11-b*22]}function face(p,col){x.beginPath();p.forEach((v,i)=>i?x.lineTo(...v):x.moveTo(...v));x.closePath();x.fillStyle=col;x.fill();x.strokeStyle='#101722';x.stroke()}function draw(){x.clearRect(0,0,c.width,c.height);Object.values(blocks).filter(v=>v.y<=y).sort((a,b)=>a.x+a.z+a.y-(b.x+b.z+b.y)).forEach(v=>{let p=iso(v.x,v.y,v.z),s=11,h=22,col=mats[v.mat]||'#888';face([[p[0],p[1]-h],[p[0]+s,p[1]-h+s/2],[p[0],p[1]-h+s],[p[0]-s,p[1]-h+s/2]],col);face([[p[0]-s,p[1]-h+s/2],[p[0],p[1]-h+s],[p[0],p[1]+s],[p[0]-s,p[1]+s/2]],'#52677d');face([[p[0]+s,p[1]-h+s/2],[p[0],p[1]-h+s],[p[0],p[1]+s],[p[0]+s,p[1]+s/2]],'#394b61')});document.getElementById('count').textContent=Object.keys(blocks).length+' bloques · capa '+y}function place(e){let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height,X=(px-450)/22,Z=(py-100+y*22)/11,a=Math.round((X+Z)/2),d=Math.round((Z-X)/2),k=key(a,y,d);if(tool==='erase')delete blocks[k];else blocks[k]={x:a,y,z:d,mat};draw()}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);place(e)};function clearAll(){blocks={};draw()}function sample(){clearAll();for(let a=0;a<8;a++)for(let d=0;d<8;d++){blocks[key(a,0,d)]={x:a,y:0,z:d,mat:'planks'};if(a===0||a===7||d===0||d===7)for(let b=1;b<4;b++)blocks[key(a,b,d)]={x:a,y:b,z:d,mat:'planks'}}draw()}function save(){let o={schema:'bedrock-ai-architect/voxel-design-v1',name:'My structure',size:{x:32,y:21,z:32},blocks:Object.values(blocks)},u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='structure-design.json';a.click();URL.revokeObjectURL(u)}function loadFile(e){let r=new FileReader();r.onload=()=>{let o=JSON.parse(r.result);blocks={};o.blocks.forEach(v=>blocks[key(v.x,v.y,v.z)]=v);draw()};r.readAsText(e.target.files[0])}draw();</script></html>
