<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rig Studio</title><style>body{margin:0;background:#101722;color:#eef;font:15px system-ui;padding:14px}main{max-width:850px;margin:auto}section{background:#1d2a3b;padding:14px;border-radius:12px;margin:10px 0}input,button,select{padding:9px;margin:4px;background:#30445e;color:white;border:1px solid #58708f;border-radius:7px}label{display:block;margin-top:9px}canvas{width:100%;height:330px;background:#0b1018;border-radius:8px}.bone{padding:6px;background:#30445e;margin:4px;border-radius:6px}</style><main><h2>Rig Studio — huesos y proporciones</h2><p>Editor de diseño para modificar un zombi gordo/flaco. No modifica el modelo del juego hasta convertir y validar los archivos.</p><section><b>Jerarquía</b><div id="list"></div><button onclick="add()">+ Hueso</button><button onclick="removeBone()">Eliminar</button></section><section><label>Nombre <input id="name"></label><label>Padre <select id="parent"></select></label><label>Escala X <input id="sx" type="range" min=".3" max="2.5" step=".05"></label><label>Escala Y <input id="sy" type="range" min=".3" max="2.5" step=".05"></label><label>Escala Z <input id="sz" type="range" min=".3" max="2.5" step=".05"></label><label>Dimensiones X/Y/Z <input id="dx" type="number" step=".5"><input id="dy" type="number" step=".5"><input id="dz" type="number" step=".5"></label><label>Pivote X/Y/Z <input id="px" type="number"><input id="py" type="number"><input id="pz" type="number"></label><button onclick="apply()">Aplicar</button><button onclick="preset(1)">Zombi gordo</button><button onclick="preset(0)">Zombi flaco</button><button onclick="exportRig()">Exportar rig-design.json</button><button onclick="exportGeo()">Exportar plantilla geo.json</button><button onclick="document.getElementById('file').click()">Importar JSON</button><input hidden id="file" type="file" accept=".json" onchange="importRig(event)"></section><section><canvas id="c" width="700" height="420"></canvas><p>Vista esquemática 2D. Revisa UV, pivotes, animaciones y hitbox por separado.</p></section></main><script>
let b=[{name:'root',parent:null,pivot:[0,0,0],size:[0,0,0],scale:[1,1,1],origin:[0,0,0]},{name:'body',parent:'root',pivot:[0,12,0],size:[8,12,4],scale:[1,1,1],origin:[-4,6,-2]},{name:'head',parent:'body',pivot:[0,24,0],size:[8,8,8],scale:[1,1,1],origin:[-4,24,-4]},{name:'arm_left',parent:'body',pivot:[-6,19,0],size:[3,11,3],scale:[1,1,1],origin:[-8,13,-1.5]},{name:'arm_right',parent:'body',pivot:[6,19,0],size:[3,11,3],scale:[1,1,1],origin:[5,13,-1.5]},{name:'leg_left',parent:'root',pivot:[-2,6,0],size:[4,12,4],scale:[1,1,1],origin:[-4,-6,-2]},{name:'leg_right',parent:'root',pivot:[2,6,0],size:[4,12,4],scale:[1,1,1],origin:[0,-6,-2]}];let s=1;const $=x=>document.getElementById(x);function render(){ $('list').innerHTML=b.map((v,i)=>`<div class="bone" onclick="s=${i};load()">${i===s?'▶ ':''}${v.name}</div>`).join('');$('parent').innerHTML='<option value="">ninguno</option>'+b.map(v=>`<option>${v.name}</option>`).join('');draw()}function load(){let v=b[s];$('name').value=v.name;$('parent').value=v.parent||'';['x','y','z'].forEach((a,i)=>{$('s'+a).value=v.scale[i];$('d'+a).value=v.size[i]||1;$('p'+a).value=v.pivot[i]}) ;render()}function apply(){let v=b[s];v.name=$('name').value||v.name;v.parent=$('parent').value||null;['x','y','z'].forEach((a,i)=>{v.scale[i]=+$('s'+a).value;v.size[i]=+$('d'+a).value;v.pivot[i]=+$('p'+a).value});render()}function add(){b.push({name:'bone_'+b.length,parent:b[s].name,pivot:[0,0,0],size:[4,4,4],scale:[1,1,1],origin:[0,0,0]});s=b.length-1;load()}function removeBone(){if(b.length>1){let n=b[s].name;b=b.filter(x=>x.name!==n);b.forEach(x=>{if(x.parent===n)x.parent=null});s=0;load()}}function preset(f){let v=b.find(x=>x.name==='body');v.scale[0]=f?1.7:.65;v.scale[2]=f?1.6:.7;v.size[0]=f?11:6;let arms=b.filter(x=>x.name.startsWith('arm'));arms.forEach(x=>x.size[0]=f?4:2.5);load()}function draw(){let c=$('c'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);let body=b.find(x=>x.name==='body'),head=b.find(x=>x.name==='head');x.fillStyle='#6687a8';x.fillRect(350-body.size[0]*body.scale[0]*7/2,190,body.size[0]*body.scale[0]*7,body.size[1]*body.scale[1]*7);x.fillRect(350-head.size[0]*head.scale[0]*3.5,120,head.size[0]*head.scale[0]*7,head.size[1]*head.scale[1]*7);x.fillStyle='white';x.fillText('Previsualización esquemática de proporciones',12,20)}function dl(n,o){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}function exportRig(){dl('rig-design.json',{schema:'bedrock-ai-architect/rig-v1',bones:b})}function exportGeo(){dl('geometry.template.geo.json',{format_version:'1.12.0','minecraft:geometry':[{'description':{'identifier':'geometry.custom_mob','texture_width':64,'texture_height':64,'visible_bounds_width':3,'visible_bounds_height':3,'visible_bounds_offset':[0,1,0]},bones:b.filter(x=>x.name!=='root').map(x=>({name:x.name,parent:x.parent,pivot:x.pivot,cubes:[{origin:x.origin,size:x.size,uv:[0,0]}]}))}]})}function importRig(e){let r=new FileReader();r.onload=()=>{let o=JSON.parse(r.result);b=o.bones||o['minecraft:geometry'][0].bones;s=0;load()};r.readAsText(e.target.files[0])}load();</script></html>
